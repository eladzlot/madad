name: Deploy remote (trial)

# Deploys the `remote` branch — the server-backed trial instance
# (docs/REMOTE_SPEC.md §12) — to the Cloudflare Pages project madad-remote,
# Functions included (wrangler bundles functions/ from the repo root; the
# output dir comes from wrangler.toml). The public app is deployed from
# `main` by deploy-cloudflare.yml and never from here.
#
# Same self-contained gate as the public deploy: a broken bundle never ships.
#
# The trial lives in its OWN Cloudflare account, so its credentials live in the
# `trial` GitHub Environment rather than at repository level. Three consequences:
#   • the job only sees them after the environment's rules pass — a required
#     reviewer, so nothing reaches a system real therapists use without a human
#     saying so, and only the `remote` branch may deploy to it;
#   • the names carry a _REMOTE suffix even though the environment already
#     scopes them. Deliberate: if this job ever loses its `environment:` line
#     the secrets resolve empty and it fails loudly, rather than silently
#     falling back to the personal account's repo secrets. That exact silent
#     fallback created a project and database in the wrong account on
#     2026-09-14;
#   • GitHub records who approved each deployment — a free audit trail.
#
# D1 migrations are deliberately NOT run here; see the note by the deploy step.
# Runtime secrets (HMAC_SECRET, IP_SALT, EMAIL_API_TOKEN) are set once with
# `wrangler pages secret put` — see scripts/remote/README.md — and are not
# touched by this workflow.

on:
  push:
    branches: [remote]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-remote
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate, build, deploy (trial)
    runs-on: ubuntu-latest
    environment: trial

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Gate ──────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Unit tests (incl. server handlers)
        run: npm test

      - name: Validate configs
        run: npm run validate:configs

      - name: Validate catalog (no-text rule applied)
        run: npm run validate:catalog

      - name: Build (gate)
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Functions bundle compiles
        run: npx wrangler pages functions build --outdir=/tmp/fnbuild

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (dev + dist-smoke incl. remote suites)
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-remote
          path: playwright-report/
          retention-days: 7

      # ── Production build, migrate, deploy ─────────────────────────────────
      - name: Production build
        env:
          MADAD_BASE: /
        run: npm run build

      # Migrations are applied by hand from the runbook, not from here. They run
      # against the database holding patient data, and a bad one would reach it
      # with nothing in between. `d1 migrations apply` is idempotent, so the
      # risk is not re-running — it is an untested migration shipping on a push.
      # Applying it deliberately costs one command and makes whoever runs it
      # read the migration first.
      - name: Deploy → madad-remote (dist + functions)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_REMOTE }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_REMOTE }}
          command: pages deploy --branch=remote
