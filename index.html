<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="shortcut icon" href="public/favicon.svg" />
  <!-- Static defaults are Hebrew; app.js re-stamps <html lang/dir> and the
       title from the link's lang= before the first screen renders. Link
       previews (WhatsApp) can only see this static HTML, so they are bilingual. -->
  <title>מדד — שאלון לפני הפגישה · Madad</title>

  <!-- Open Graph / WhatsApp — patient facing -->
  <meta property="og:title" content="מלאו שאלון לפני הפגישה · Fill in a questionnaire before your session" />
  <meta property="og:description" content="כדי לעזור למטפל שלכם להבין אתכם טוב יותר · To help your therapist understand you better" />
  <meta property="og:image" content="https://app.ezmadad.com/og-image-app.png" />
  <meta property="og:url" content="https://app.ezmadad.com/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
